name: Build Life EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller and Pillow
        run: pip install pyinstaller pillow

      - name: Generate Yin-Yang Icon
        run: |
          python -c "
          from PIL import Image, ImageDraw
          size = 512
          img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)
          pad = 16
          box = [pad, pad, size - pad, size - pad]
          draw.pieslice(box, 90, 270, fill='#1A1C24', outline='#FFC107', width=10)
          draw.pieslice(box, 270, 90, fill='#FFC107', outline='#FFC107', width=10)
          r = (size - 2 * pad) // 2
          cx = size // 2
          draw.ellipse([cx - r//2, pad, cx + r//2, pad + r], fill='#FFC107')
          draw.ellipse([cx - r//2, pad + r, cx + r//2, size - pad], fill='#1A1C24')
          dot = r // 5
          draw.ellipse([cx - dot, pad + r//2 - dot, cx + dot, pad + r//2 + dot], fill='#1A1C24')
          draw.ellipse([cx - dot, pad + r + r//2 - dot, cx + dot, pad + r + r//2 + dot], fill='#FFC107')
          img.save('yin_yang.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])
          "

      - name: Build Life.exe with Icon
        run: pyinstaller --noconsole --onefile --icon="yin_yang.ico" --add-data "yin_yang.ico;." --name "Life" life_app.py

      - name: Upload Life.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Life-Windows-App
          path: dist/Life.exe
